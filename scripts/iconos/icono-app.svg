<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Ícono de la app: un ticket de venta que es un panda.
    Fondo Turquesa Acción a sangre: iOS y Android le aplican su propia máscara.
    El dibujo cabe en el círculo central del 80% (zona segura de los íconos
    "maskable"), así que el mismo archivo sirve para "any" y "maskable".
    Fuente de los PNG: `npm run iconos` (scripts/generar_iconos.mjs).
  -->
